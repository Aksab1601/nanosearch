<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nanosearch</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #272b35;
    --text: #e7e9ee; --muted: #9aa3b2; --accent: #6ea8fe;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f7f8fa; --panel: #fff; --line: #e3e6ec;
            --text: #1a1d24; --muted: #5c6472; --accent: #2b6cb0; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 780px; margin: 0 auto; padding: 48px 20px 80px; }
  h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 0 0 28px; font-size: 14px; }
  .sub code { background: var(--panel); border: 1px solid var(--line);
              border-radius: 4px; padding: 1px 5px; font-size: 12px; }
  form { display: flex; gap: 8px; margin-bottom: 10px; }
  input[type=search] {
    flex: 1; padding: 12px 14px; font-size: 15px; color: var(--text);
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  }
  input[type=search]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { padding: 12px 18px; font-size: 15px; font-weight: 500; cursor: pointer;
           color: #fff; background: var(--accent); border: 0; border-radius: 8px; }
  button:disabled { opacity: .55; cursor: default; }
  .controls { display: flex; align-items: center; gap: 10px; color: var(--muted);
              font-size: 13px; margin-bottom: 26px; flex-wrap: wrap; }
  .controls input[type=range] { width: 150px; accent-color: var(--accent); }
  .meta { color: var(--muted); font-size: 13px; margin: 0 0 14px; min-height: 20px; }
  .hit { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
         padding: 14px 16px; margin-bottom: 10px; }
  .hit-top { display: flex; justify-content: space-between; gap: 12px;
             color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .tag { border: 1px solid var(--line); border-radius: 20px; padding: 1px 9px; }
  .score { font-variant-numeric: tabular-nums; }
  .examples { color: var(--muted); font-size: 13px; }
  .examples button { background: none; border: 0; color: var(--accent);
                     padding: 0 2px; font-size: 13px; text-decoration: underline; }
  footer { margin-top: 36px; color: var(--muted); font-size: 12px;
           border-top: 1px solid var(--line); padding-top: 14px; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>nanosearch</h1>
  <p class="sub">
    Vector search built from scratch — IVF-PQ indexing, exact re-ranking, NumPy only.
    API docs at <code>/docs</code>, index stats at <code>/stats</code>.
  </p>

  <form id="form">
    <input id="q" type="search" placeholder="Ask about anything in the corpus…"
           autocomplete="off" autofocus>
    <button id="go" type="submit">Search</button>
  </form>

  <div class="controls">
    <label for="k">results</label>
    <input id="k" type="range" min="1" max="20" value="5">
    <span id="kv">5</span>
    <span class="examples">
      try:
      <button type="button" data-q="how do neural networks learn">neural networks</button>
      <button type="button" data-q="why is my database query slow">slow queries</button>
      <button type="button" data-q="how far away are the stars">stars</button>
      <button type="button" data-q="my seedlings keep dying">seedlings</button>
    </span>
  </div>

  <p class="meta" id="meta"></p>
  <div id="results"></div>

  <footer>
    Exact search is the ground truth; the approximate index is measured against it.
    See the <a href="/docs">API</a> for <code>nprobe</code>, the recall/latency dial.
  </footer>
</div>

<script>
const form = document.getElementById('form');
const input = document.getElementById('q');
const button = document.getElementById('go');
const slider = document.getElementById('k');
const sliderValue = document.getElementById('kv');
const meta = document.getElementById('meta');
const results = document.getElementById('results');

slider.addEventListener('input', () => { sliderValue.textContent = slider.value; });

document.querySelectorAll('.examples button').forEach((b) => {
  b.addEventListener('click', () => { input.value = b.dataset.q; form.requestSubmit(); });
});

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

function render(payload) {
  if (!payload.results.length) {
    results.innerHTML = '';
    meta.textContent = 'No results.';
    return;
  }
  meta.textContent = `${payload.results.length} result(s) in ${payload.took_ms} ms server-side`;
  results.innerHTML = payload.results.map((hit) => {
    const topic = hit.metadata && hit.metadata.topic ? hit.metadata.topic : 'doc';
    return `<div class="hit">
      <div class="hit-top">
        <span class="tag">${escapeHtml(topic)}</span>
        <span class="score">cosine ${hit.score.toFixed(4)}</span>
      </div>
      <div>${escapeHtml(hit.text)}</div>
    </div>`;
  }).join('');
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  const query = input.value.trim();
  if (!query) return;
  button.disabled = true;
  meta.textContent = 'Searching…';
  try {
    const response = await fetch('/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, k: Number(slider.value) }),
    });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    render(await response.json());
  } catch (error) {
    results.innerHTML = '';
    meta.textContent = `Request failed: ${error.message}`;
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
